<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>राधा नाम जाप</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap');


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    min-height:100vh;

    font-family:
        "Noto Sans Devanagari",
        "Mangal",
        sans-serif;

    color:#fff7e8;

    background:
        radial-gradient(
            circle at 50% 18%,
            #641b3b 0%,
            #2b0b1c 45%,
            #0e0409 100%
        );

    overflow:hidden;
}


/* Background glow */

body::before{

    content:"";

    position:fixed;

    width:500px;
    height:500px;

    border-radius:50%;

    background:#d9a441;

    filter:blur(180px);

    opacity:.12;

    top:-180px;

    left:50%;

    transform:translateX(-50%);

    pointer-events:none;
}


/* Main container */

.container{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:25px 20px;

    position:relative;

    text-align:center;
}


/* Om */

.om{

    font-size:30px;

    color:#e5b75b;

    margin-bottom:8px;

    text-shadow:
        0 0 15px rgba(229,183,91,.3);
}


/* Heading */

h1{

    font-size:34px;

    font-weight:700;

    letter-spacing:1px;
}


.subtitle{

    margin-top:5px;

    font-size:14px;

    color:#d9c5a8;
}


/* Counter */

.counter-box{

    margin-top:25px;

    padding:12px 32px;

    border:
        1px solid
        rgba(229,183,91,.25);

    border-radius:50px;

    background:
        rgba(255,255,255,.05);

    backdrop-filter:blur(12px);

    box-shadow:
        0 8px 30px rgba(0,0,0,.25);
}


.counter-label{

    font-size:13px;

    color:#cdb99d;
}


#count{

    display:block;

    margin-top:2px;

    font-size:32px;

    font-weight:700;

    color:#f1c96d;

    min-width:40px;
}


/* Main circle */

.jap-button{

    width:280px;

    height:280px;

    margin-top:30px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    cursor:pointer;

    user-select:none;

    -webkit-tap-highlight-color:transparent;


    background:
        radial-gradient(
            circle at 35% 30%,
            #96365c,
            #5b1735 58%,
            #350c1f 100%
        );


    border:
        2px solid
        rgba(239,199,111,.75);


    box-shadow:

        0 0 0 8px
        rgba(229,183,91,.07),

        0 0 45px
        rgba(220,165,70,.18),

        inset 0 0 40px
        rgba(0,0,0,.35);


    transition:
        transform .12s ease,
        box-shadow .12s ease;
}


/* Inner circle */

.jap-button::before{

    content:"";

    position:absolute;

    inset:12px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,220,145,.28);
}


.jap-button::after{

    content:"";

    position:absolute;

    inset:22px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.08);
}


/* Click effect */

.jap-button:active{

    transform:scale(.94);

    box-shadow:

        0 0 0 8px
        rgba(229,183,91,.1),

        0 0 65px
        rgba(220,165,70,.35),

        inset 0 0 45px
        rgba(0,0,0,.4);
}


/* Radha */

.radha{

    position:relative;

    z-index:2;

    font-size:68px;

    font-weight:800;

    color:#ffe7a5;

    text-shadow:

        0 0 12px
        rgba(255,209,104,.3),

        0 4px 12px
        rgba(0,0,0,.35);
}


/* Hint */

.hint{

    margin-top:24px;

    color:#bca991;

    font-size:14px;
}


/* Reset */

.reset{

    margin-top:18px;

    padding:10px 22px;

    border-radius:30px;

    border:
        1px solid
        rgba(229,183,91,.25);

    background:
        rgba(255,255,255,.05);

    color:#cdb99d;

    font-family:inherit;

    font-size:13px;

    cursor:pointer;

    transition:.2s;
}


.reset:hover{

    background:
        rgba(229,183,91,.1);

    color:#f1c96d;
}


.reset:active{

    transform:scale(.95);
}


/* =========================
   RADHA POPUP
========================= */

.jap-name{

    position:fixed;

    pointer-events:none;

    z-index:9999;

    color:#f1c96d;

    font-size:32px;

    font-weight:800;

    white-space:nowrap;

    text-shadow:

        0 0 15px
        rgba(241,201,109,.7),

        0 3px 10px
        rgba(0,0,0,.5);

    animation:
        radhaPop
        1s
        ease-out
        forwards;
}


/* Popup animation */

@keyframes radhaPop{

    0%{

        opacity:0;

        transform:
            translate(-50%,0)
            scale(.5);
    }


    15%{

        opacity:1;

        transform:
            translate(-50%,-15px)
            scale(1);
    }


    70%{

        opacity:1;

        transform:
            translate(-50%,-100px)
            scale(1.05);
    }


    100%{

        opacity:0;

        transform:
            translate(-50%,-150px)
            scale(1.15);
    }

}


/* Footer */

.footer{

    position:absolute;

    bottom:18px;

    font-size:11px;

    color:#806d5c;
}


/* Mobile */

@media(max-width:600px){

    h1{

        font-size:29px;
    }


    .subtitle{

        font-size:13px;
    }


    .jap-button{

        width:250px;

        height:250px;
    }


    .radha{

        font-size:60px;
    }


    .counter-box{

        margin-top:22px;
    }

}

</style>

</head>



<body>


<!-- =========================
     RADHA AUDIO
========================= -->

<audio
    id="radhaAudio"
    src="./radha.mp3.m4a"
    preload="auto">
</audio>



<div class="container">


    <!-- OM -->

    <div class="om">

        ॐ

    </div>



    <!-- TITLE -->

    <h1>

        राधा नाम जाप

    </h1>



    <div class="subtitle">

        प्रेम और श्रद्धा से राधा नाम का जाप करें

    </div>



    <!-- COUNTER -->

    <div class="counter-box">

        <div class="counter-label">

            कुल जाप

        </div>


        <span id="count">

            0

        </span>

    </div>



    <!-- MAIN CIRCLE -->

    <div
        class="jap-button"
        id="japButton"
        aria-label="राधा नाम जाप करें"
    >

        <div class="radha">

            राधा

        </div>

    </div>



    <!-- HINT -->

    <div class="hint">

        राधा नाम जपने के लिए स्पर्श करें

    </div>



    <!-- RESET -->

    <button
        class="reset"
        id="resetButton"
    >

        काउंटर रीसेट करें

    </button>



    <!-- FOOTER -->

    <div class="footer">

        राधे राधे 🪷

    </div>


</div>



<script>


/* =========================
   ELEMENTS
========================= */

const button =
    document.getElementById("japButton");

const countText =
    document.getElementById("count");

const resetButton =
    document.getElementById("resetButton");

const radhaAudio =
    document.getElementById("radhaAudio");



/* =========================
   LOAD SAVED COUNT
========================= */

let count =
    Number(
        localStorage.getItem(
            "radhaJapCount"
        )
    ) || 0;



/* =========================
   UPDATE COUNTER
========================= */

function updateCount(){

    countText.textContent =
        count.toLocaleString("en-IN");

}


updateCount();



/* =========================
   CIRCLE CLICK
========================= */

button.addEventListener(
    "click",
    function(){

        /* Counter +1 */

        count++;


        /* Save counter */

        localStorage.setItem(
            "radhaJapCount",
            count
        );


        /* Update screen */

        updateCount();



        /* =====================
           PLAY RADHA AUDIO
        ===================== */

        radhaAudio.pause();

        radhaAudio.currentTime = 0;

        radhaAudio.volume = 1;


        const playPromise =
            radhaAudio.play();


        if(playPromise !== undefined){

            playPromise.catch(
                function(error){

                    console.log(
                        "Audio playback blocked:",
                        error
                    );

                }
            );

        }



        /* =====================
           RADHA POPUP
        ===================== */

        const name =
            document.createElement("div");


        name.className =
            "jap-name";


        name.textContent =
            "राधा";



        /* Circle position */

        const rect =
            button.getBoundingClientRect();


        const x =
            rect.left +
            rect.width / 2;


        const y =
            rect.top +
            rect.height / 2;



        name.style.left =
            x + "px";


        name.style.top =
            y + "px";



        /* Add popup */

        document.body.appendChild(
            name
        );



        /* Remove popup */

        setTimeout(
            function(){

                name.remove();

            },
            1000
        );

    }
);



/* =========================
   RESET BUTTON
========================= */

resetButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();


        count = 0;


        localStorage.setItem(
            "radhaJapCount",
            "0"
        );


        updateCount();

    }
);

</script>


</body>

</html>
